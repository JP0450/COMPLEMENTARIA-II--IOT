# Configuración de Mosquitto MQTT Broker
# Ubicar este archivo en: C:\Program Files\mosquitto\mosquitto.conf (Windows)
# O en: /etc/mosquitto/mosquitto.conf (Linux)

# Puerto TCP estándar
listener 1883

# Permitir conexiones anónimas (para desarrollo)
allow_anonymous true

# Opcional: Puerto WebSocket para conexiones desde navegador
# listener 9001
# protocol websockets

# Logs
log_dest file C:\Program Files\mosquitto\mosquitto.log
log_type error
log_type warning
log_type information
log_type debug

# Persistencia (opcional)
persistence true
persistence_location C:\Program Files\mosquitto\
persistence_file mosquitto.db

# Límites de conexión
max_connections 100
max_queued_messages 1000

# Mensajes de retención (útil para estado de dispositivos)
allow_zero_length_clientid true
auto_id_prefix auto-

# Nota: En producción, deshabilitar allow_anonymous y configurar autenticación
# password_file C:\Program Files\mosquitto\passwd
