# Configuración local de Mosquitto para proyecto IoT
# Ejecutar con: mosquitto -c mosquitto_local.conf -v

# Puerto TCP - escuchar en todas las interfaces
listener 1883 0.0.0.0

# Permitir conexiones anónimas (solo para desarrollo)
allow_anonymous true

# Deshabilitar persistencia (datos en memoria)
persistence false

# Logs a consola
log_dest stderr
log_type error
log_type warning
log_type information

# Conexiones máximas
max_connections 100
